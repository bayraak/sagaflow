\* What is proven. Exhaustive, green.
\*
\* The invariants of Sagaflow.cfg minus the five that findings F1 and F2
\* refute. Running this model is how the guarantees table in
\* docs/guarantees.md is entitled to say "model-checked".
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = TRUE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4c_CompleteAtClose
    I6_KeyExclusivity

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
