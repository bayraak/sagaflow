\* The proven set again, one step and one invocation deeper.
\*
\* Four steps and four durable invocations, 5.6 million distinct states,
\* about half a minute. Nothing new appears at this depth, which is the
\* evidence that the three-step model is not hiding anything behind its
\* bounds.
SPECIFICATION Spec

CONSTANTS
    N = 4
    MaxInvocations = 4
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = TRUE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4c_CompleteAtClose
    I6_KeyExclusivity

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
