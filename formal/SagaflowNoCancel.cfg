\* Confinement of finding F1: the base model with cancellation removed.
\*
\* Green. This is the mechanical proof that F1 is confined to the
\* cancellation path: I4, I5, I7 and I8 are all refuted when a run can be
\* asked to stop, and all hold when it cannot. The cause is that a memoised
\* step does not call recordStep and so does not re-read the cancellation
\* flag, which lets a re-invoked body walk PAST the point at which the
\* invocation that closed the run stopped.
\*
\* I4b and I4d are absent because finding F2 refutes them here too, and F2
\* has nothing to do with cancellation.
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = FALSE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4_CompensationCompleteness
    I4c_CompleteAtClose
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced
    I8_NoEffectAfterClose

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
