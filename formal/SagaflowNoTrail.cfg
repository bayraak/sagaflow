\* Ablation: a journal that cannot read a trail back.
\*
\* listRunSteps is optional in the journal contract, and the durable executor
\* skips the entry read when it is absent. Two of this study's findings come
\* straight back: a refused undo is retried by a later invocation and can
\* succeed after undos that started later (F2), and a run that had begun
\* unwinding is carried forward into steps that never ran (F4). Both end in
\* an undo order that is not reverse start order.
\* Expect I4b and I4d to be refuted.
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = TRUE
    EntryGuard = TRUE
    TrailAtEntry = FALSE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I4_CompensationCompleteness
    I4b_ReverseStartOrder
    I4c_CompleteAtClose
    I4d_ReverseStartOrderAtClose
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I9_CompletedUndidNothing

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
