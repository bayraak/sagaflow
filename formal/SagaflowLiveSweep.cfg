\* Ablation: the abandoned-run sweeper's window is shorter than the request.
\*
\* sweepAbandonedRuns is documented as needing a window "comfortably longer
\* than your longest inline request". This model removes that assumption and
\* lets the sweeper close a run that is still alive, to measure what the
\* misconfiguration actually costs. Expect I5 and I7 to be refuted: the
\* sweeper's announcement takes ordinal 0, which is the same envelope id the
\* run's first emission uses, so the live run's finish drops its first event
\* on the conflict and writes a completed lifecycle beside a compensated one.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxInvocations = 1
    MaxLostMarks = 0
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = TRUE
    Cancellable = FALSE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
