\* Ablation: the abandoned-run sweeper's window is shorter than the request.
\*
\* sweepAbandonedRuns is documented as needing a window "comfortably longer
\* than your longest inline request". This model removes that assumption and
\* lets the sweeper close a run that is still alive, to measure what the
\* misconfiguration actually costs.
\*
\* Finding F3 was one half of that cost and is fixed: the sweep's
\* announcement no longer takes an ordinal from the run's own emission
\* sequence, so it cannot displace an event the run really emitted. What
\* remains is inherent to closing a live run -- its finish still arrives
\* afterwards and still writes its rows, so the outbox grows after the close
\* and holds two closure announcements for one run.
\* Expect I5 and I7 to be refuted.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxInvocations = 1
    MaxLostMarks = 0
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = TRUE
    Cancellable = FALSE
    EntryGuard = TRUE
    TrailAtEntry = TRUE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
