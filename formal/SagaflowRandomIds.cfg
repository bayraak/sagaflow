\* Ablation: envelope ids minted fresh per invocation instead of a function
\* of the run.
\*
\* This is what the engine did before the extraction closed gap 1 of the
\* original plan. It shows what deterministic ids buy: with them, a re-invoked
\* body writes the same ids onto rows that already exist; without them, the
\* consumer is handed copies it has no way to recognise and acts twice.
\*
\* The entry guard is off here as well, deliberately. With it on, a durable
\* invocation stops before it can write a second set of envelopes, which
\* would hide the id property behind the guard rather than measure it.
\* Expect I3 (exactly-once effect) and I5 to be refuted.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxInvocations = 2
    MaxLostMarks = 1
    DeterministicIds = FALSE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = FALSE
    EntryGuard = FALSE
    TrailAtEntry = TRUE

INVARIANTS
    TypeOK
    I3_ExactlyOnceEffect
    I5_ReinvocationIdempotency

CHECK_DEADLOCK FALSE
