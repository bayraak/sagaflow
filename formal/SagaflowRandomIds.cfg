\* Ablation: envelope ids minted fresh per invocation instead of ${runId}:${ordinal}.
\*
\* This is what the engine did before the extraction closed gap 1 of plan 031
\* section 3. It shows what deterministic ids buy: with them, a re-invoked
\* body writes the same ids onto rows that already exist; without them, the
\* consumer is handed copies it has no way to recognise and acts twice.
\* Expect I3 (exactly-once effect) and I5 to be refuted.
SPECIFICATION Spec

CONSTANTS
    N = 2
    MaxInvocations = 2
    MaxLostMarks = 1
    DeterministicIds = FALSE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = FALSE

INVARIANTS
    TypeOK
    I3_ExactlyOnceEffect
    I5_ReinvocationIdempotency

CHECK_DEADLOCK FALSE
