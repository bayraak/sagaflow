\* Ablation: a platform that re-executes a failed step instead of replaying
\* its failure.
\*
\* Deterministic replay of a FAILED step is the one thing Cloudflare's
\* documentation does not say: it records that a completed step is read back
\* from its persisted result, and is silent on what a re-invocation does with
\* one that exhausted its retries. This model removes the assumption and lets
\* a previously failed step run again and succeed.
\*
\* Clean. Once the trail is read at entry, a run that has begun unwinding
\* does not carry the body forward into any step that is not already
\* recorded completed -- including the one that failed -- so the platform's
\* answer to that question stops mattering.
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = FALSE
    LiveSweep = FALSE
    Cancellable = TRUE
    EntryGuard = TRUE
    TrailAtEntry = TRUE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4_CompensationCompleteness
    I4b_ReverseStartOrder
    I4c_CompleteAtClose
    I4d_ReverseStartOrderAtClose
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced
    I8_NoEffectAfterClose
    I9_CompletedUndidNothing

PROPERTIES
    NeverReopens

\* A run that has closed, delivered and been swept has nothing left to do.
\* Reaching that state is the point, not a deadlock.
CHECK_DEADLOCK FALSE
