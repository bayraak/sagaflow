\* The shipped design, with every invariant this study states.
\*
\* Six of them are refuted. That is not a defect in the model: findings F1
\* and F2 in RESULTS.md are real, and the invariants are left exactly as they
\* were first written so that TLC keeps producing the counterexample until
\* the engine stops producing the behaviour.
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = TRUE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4_CompensationCompleteness
    I4b_ReverseStartOrder
    I4c_CompleteAtClose
    I4d_ReverseStartOrderAtClose
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced
    I8_NoEffectAfterClose

PROPERTIES
    NeverReopens

\* A run that has closed, delivered and been swept has nothing left to do.
\* Reaching that state is the point, not a deadlock.
CHECK_DEADLOCK FALSE
