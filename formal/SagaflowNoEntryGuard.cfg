\* Ablation: a journal that cannot read a run back.
\*
\* getRun is optional in the journal contract, and the durable executor skips
\* the entry guard when it is absent. Clean at these bounds -- which is the
\* finding: once the trail is read, the trail carries every invariant this
\* study states, and the entry guard is defence in depth rather than the
\* thing holding them up.
\*
\* It is kept because it closes a window the trail cannot see: a run closed
\* by something that left no compensation behind -- a refused start, an
\* operator, a sweep -- has no trail to read, and only the run's own status
\* says it has ended.
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = TRUE
    EntryGuard = FALSE
    TrailAtEntry = TRUE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4_CompensationCompleteness
    I4c_CompleteAtClose
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced
    I8_NoEffectAfterClose
    I9_CompletedUndidNothing

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
