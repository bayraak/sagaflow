\* Ablation: a journal with neither optional read.
\*
\* getRun and listRunSteps are both optional in the journal contract, and a
\* journal that offers neither leaves the durable executor with nothing to
\* read at entry -- which is the engine as it was before this study. Every
\* finding comes straight back: a re-invoked body walks past the point at
\* which the run was closed (F1), a refused undo is retried out of order
\* (F2), a run that had begun unwinding is carried forward into steps that
\* never ran (F4), and a fully unwound run can close COMPLETED with all of
\* its effects reversed (F5).
SPECIFICATION Spec

CONSTANTS
    N = 3
    MaxInvocations = 3
    MaxLostMarks = 1
    DeterministicIds = TRUE
    JournalledFailures = TRUE
    LiveSweep = FALSE
    Cancellable = TRUE
    EntryGuard = FALSE
    TrailAtEntry = FALSE

INVARIANTS
    TypeOK
    I1_FinishExactlyOnce
    I2_NoCompletedWithoutEvents
    I3_ExactlyOnceEffect
    I3b_DeliveredOnceWhenDrained
    I4_CompensationCompleteness
    I4c_CompleteAtClose
    I5_ReinvocationIdempotency
    I6_KeyExclusivity
    I7_OneClosureAnnounced
    I8_NoEffectAfterClose

    I9_CompletedUndidNothing

PROPERTIES
    NeverReopens

CHECK_DEADLOCK FALSE
